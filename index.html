// Экран «Размер» (11931:126178; поле размера и меню величин — PropertyGrid 23509:285817)
function sizeScreenHTML() {
  const { size, padding, margin, hideEmpty } = state;
  // Поле размера (PropertyGrid 23509:285935): значение + единица; клик по единице — меню величин
  const UNIT = { px: "px", pct: "%", auto: "по контенту", fill: "заполнить" };
  const actual = { w: widgetFrame.offsetWidth, h: widgetFrame.offsetHeight };
  const sizeField = (k, label) => {
    const a = size[k];
    const fixed = a.mode === "px" || a.mode === "pct";
    const value = a.mode === "px" ? a.px : a.mode === "pct" ? a.pct : "";
    return `
      <span class="label">${label}</span>
      <label class="size-field">
        <input id="size-${k}" data-field="size.${k}" value="${value}" placeholder="${fixed ? "" : actual[k]}" inputmode="numeric" maxlength="4" aria-label="${label}">
        <button class="size-unit" data-action="size-menu" data-key="${k}" aria-haspopup="menu">${UNIT[a.mode]}</button>
      </label>`;
  };
  // Краевые значения: Min/Max ширина/высота, px, ✕ — убрать
  const EDGES = [["minW", "Min ширина"], ["maxW", "Max ширина"], ["minH", "Min высота"], ["maxH", "Max высота"]];
  const edgeRows = EDGES.filter(([k]) => size[k] != null).map(([k, label]) => `
    <span class="label">${label}</span>
    <span class="editor">
      <label class="size-field">
        <input data-field="size.${k}" value="${size[k]}" inputmode="numeric" maxlength="4" aria-label="${label}, px">
        <span class="size-unit">px</span>
      </label>
      <button class="edge-clear" data-action="edge-remove" data-key="${k}" aria-label="${label}: убрать"><i class="ico ico--s" data-i="close"></i></button>
    </span>`).join("");
  const widthField = sizeField("w", "Ширина");
  const heightField = sizeField("h", "Высота");
  const maxField = edgeRows;
  // Отступы: два поля (по горизонтали / вертикали) или блок по сторонам (PropertyGrid 23882:236302)
  const padRow = (group, label) => `
    <div class="pad-row">
      <span class="label">${label}</span>
      ${state[group].split ? sideBox(group, label) : `
      <span class="pad-fields">
        <label class="pad-field"><svg class="icon" width="12" height="12"><use href="#i-pad-h"/></svg><input data-field="${group}.h" value="${state[group].left}" inputmode="numeric" maxlength="3" aria-label="${label} по горизонтали"></label>
        <label class="pad-field"><svg class="icon" width="12" height="12"><use href="#i-pad-v"/></svg><input data-field="${group}.v" value="${state[group].top}" inputmode="numeric" maxlength="3" aria-label="${label} по вертикали"></label>
      </span>`}
      ${sideSwitch(group, "padSides", `${label} отступы по сторонам`)}
    </div>`;
  return `
    ${subHeadHTML("Размер")}
    <div class="win__body">
      <div class="cloud">
        <div class="size-form">${widthField}${heightField}${maxField}</div>
      </div>
      <div class="cloud cloud--pads">
        <span class="cloud__title">Отступы</span>
        <div class="pads">${padRow("padding", "Внутренние")}${padRow("margin", "Внешние")}</div>
      </div>
      <div class="cloud">
        <div class="toggle-row">
          <span class="label">Скрывать без данных</span>
          <button class="switch" role="switch" aria-checked="${hideEmpty}" data-action="hide-empty" aria-label="Скрывать без данных"><span class="switch__track"></span></button>
        </div>
      </div>
    </div>`;
}

const PICKER_TITLES = { title: "Текст", marker: "Маркер", background: "Фон", border: "Границы", icon: "Иконка", shadow: "Цвет" };
// Сдвиг пикера относительно свотча — как в макете (11931:124361 / 124382 / 124403)
const PICKER_OFFSET = { background: [-19, -68], title: [-16, -68], marker: [-30, -68], border: [-16, -68], icon: [-16, 30], shadow: [-16, -68] };

// Скрытый нативный выбор цвета для «Другой цвет»; живёт вне перерисовываемого окна
const nativeColor = Object.assign(document.createElement("input"), { type: "color", tabIndex: -1 });
nativeColor.style.cssText = "position:absolute;width:0;height:0;opacity:0;pointer-events:none";
nativeColor.setAttribute("aria-hidden", "true");
document.body.append(nativeColor);
nativeColor.addEventListener("input", () => {
  if (ui.picker) pickColor(nativeColor.value);
  else if (ui.shadowPalette) setState((s) => { s.shadow.color = nativeColor.value; });
});

function pickerHTML() {
  const { key, x, y, draft: part } = ui.picker;   // пикер показывает черновик, виджет — применённый цвет
  const def = DEFAULT_STATE[key];
  // выключенный элемент показываем как «нет цвета», даже если цвет сохранён;
  // у иконки цвет задан и до выбора самой иконки — показываем его
  const on = (part.on || key === "icon") && !!part.color;
  const atDefault = on && part.color === def.color && part.opacity === def.opacity;
  const hex = on ? part.color.replace("#", "").toUpperCase() : "";
  const current = on ? partColor(key, part) : null;
  const isBg = key === "background";

  return `
    <div class="picker" style="left:${x}px;top:${y}px" role="dialog" aria-label="${PICKER_TITLES[key]}">
      <header class="picker__head">
        <span class="picker__caption">${PICKER_TITLES[key]}</span>
        <span class="picker__mid">${isBg ? `
          <span class="tumbler">
            <button class="tumbler__item" aria-pressed="true">Цвет</button>
            <button class="tumbler__item" aria-pressed="false" disabled>Картинка</button>
          </span>` : ""}</span>
        <span class="picker__cmds">
          <span class="picker__tools">
            <button class="picker__tool" disabled aria-label="Пипетка"><svg class="icon" width="16" height="16"><use href="#i-pipette"/></svg></button>
            <button class="picker__tool" data-action="picker-reset" ${atDefault ? "data-idle" : ""} aria-label="Сбросить цвет"><i class="ico" data-i="reset"></i></button>
          </span>
          <button class="btn-apply" data-action="picker-apply" aria-label="Применить"><i class="ico ico--s" data-i="check"></i></button>
        </span>
        <button class="picker__close" data-action="picker-cancel" aria-label="Закрыть"><svg><use href="#i-picker-close"/></svg></button>
      </header>
      <div class="picker__body">
        <div class="pcloud picker__code" ${current ? "" : "data-none"}>
          <span class="picker__current" ${current ? `style="--current:${current}"` : "data-none"}></span>
          <span class="picker__fields">
            <span class="ufield ufield--format">HEX<i class="ico ico--s" data-i="formatArrow"></i></span>
            <span class="picker__alpha">
              <label class="ufield ufield--hex"><input id="picker-hex" value="${hex ? "#" + hex : ""}" placeholder=" " maxlength="7" spellcheck="false" aria-label="Код цвета"><span class="hex-ph" aria-hidden="true">#<span>${(def.color || "#ffffff").slice(1).toUpperCase()}</span></span></label>
              <label class="ufield ufield--alpha"><input id="picker-alpha" value="${on ? part.opacity : 0}" inputmode="numeric" maxlength="3" aria-label="Непрозрачность, %"></label>
              <span class="pct">%</span>
            </span>
          </span>
        </div>
        <div class="pcloud pcloud--colors">
          <div class="palette">
            ${paletteFor(key).map((c) => c
              ? `<button class="palette__item" style="${isBg && backgroundFill(c).startsWith("linear") ? `--swatch-fill:${backgroundFill(c)}` : `--c:${isBg ? backgroundFill(c) : c}`}" data-action="pick" data-color="${c}" aria-label="${c}"></button>`
              : `<button class="palette__item" data-none data-action="pick" data-color="" aria-label="Нет цвета"><svg width="28" height="28"><use href="#i-no-color"/></svg></button>`
            ).join("")}
          </div>
          <div class="picker__links"><div>
            <button class="plink" data-action="picker-native">Другой цвет</button>
            ${isBg ? `<button class="plink" disabled>Градиент</button><button class="plink" disabled>Текстура</button>` : ""}
          </div></div>
        </div>
      </div>
    </div>`;
}

// Выбор цвета меняет черновик пикера; на виджет он попадает только по ✓. null — «нет цвета»
function editDraft(mutator) {
  mutator(ui.picker.draft);
  render();
}
function pickColor(color) {
  editDraft((d) => {
    d.color = color || null;
    if (color) d.on = true;
  });
}

function openPicker(el) {
  const key = el.dataset.key;
  const sw = el.getBoundingClientRect();
  const slot = settingsSlot.getBoundingClientRect();
  const [dx, dy] = PICKER_OFFSET[key];
  ui.menu = null;
  ui.picker = {
    key,
    x: Math.round((sw.left - slot.left) / frame.scale + dx),
    y: Math.round((sw.top - slot.top) / frame.scale + dy),
    draft: structuredClone(state[key]),   // правки в пикере; ✓ переносит их в state, всё остальное отбрасывает
  };
  render();
}

function renderSettings() {
  // Окно можно открыть из тулбара кнопкой «Размер» (ui.anchor = "toolbar"): тогда это окно «Размер» — то же, что
  // открывается из строки «Высота» основного окна, — и оно стоит под тулбаром: левый край по кнопке, зазор 4 px
  const fromToolbar = ui.open && ui.anchor === "toolbar";
  // «Назад» из окна «Размер», открытого из тулбара, показывает основное окно на том же месте (ui.anchor остаётся);
  // кнопка «Размер» выбрана только пока открыт сам экран «Размер»
  const sizeFromToolbar = fromToolbar && ui.screen === "size";
  toolbarGear.setAttribute("aria-pressed", String(ui.open && !sizeFromToolbar));
  toolbarMove.setAttribute("aria-pressed", String(sizeFromToolbar));
  if (fromToolbar) {
    settingsSlot.style.left = (toolbarEl.offsetLeft + toolbarMove.offsetLeft) + "px";
    settingsSlot.style.top = (toolbarEl.offsetTop + toolbarEl.offsetHeight + 4) + "px";
  } else {
    settingsSlot.style.left = settingsSlot.style.top = "";
  }
  if (!ui.open) { baseline = null; settingsSlot.innerHTML = ""; return; }
  if (!baseline) baseline = structuredClone(state);

  // Не пересобираем поле названия, пока в нём печатают — иначе теряется курсор
  const focused = document.activeElement?.id === "win-name";
  if (focused && settingsSlot.dataset.screen === ui.screen) {
    // Обновляем всё, кроме шапки
    const tmp = document.createElement("div");
    tmp.innerHTML = SCREENS[ui.screen]();
    settingsSlot.querySelector(".win__body").replaceWith(tmp.querySelector(".win__body"));
  } else {
    settingsSlot.innerHTML = `<section class="win" aria-label="Настройки виджета">${SCREENS[ui.screen]()}</section>`
      + (ui.picker ? pickerHTML() : "")
      + (ui.presets ? presetsHTML() : "")
      + (ui.heightMenu ? heightMenuHTML() : "")
      + (ui.sizeMenu ? sizeMenuHTML() : "")
      + (ui.shadowPalette ? shadowPaletteHTML() : "")
      + (ui.shadowEditor ? shadowEditorHTML() : "")
      + (ui.lineMenu ? lineMenuHTML() : "")
      + (ui.fontMenu ? fontMenuHTML() : "")
      + (ui.fontEditor ? fontEditorHTML() : "")
      + (ui.iconPicker ? iconPickerHTML() : "");
    settingsSlot.dataset.screen = ui.screen;
  }
  paintIcons(settingsSlot);
}

// Действия окна
const ACTIONS = {
  "news-unread": () => setState((st) => { st.news.unread = !st.news.unread; }),
  "news-layout": (el) => setState((st) => { st.news.layout = +el.dataset.layout; }),
  reset: () => { ui.picker = null; resetState(); },
  close: () => {
    // применённое изменение — шаг истории для кнопки «назад» в шапке конструктора
    if (baseline && JSON.stringify(state) !== JSON.stringify(baseline)) (envHistory[groupOf(w.dataset.kind)] ||= []).push(structuredClone(baseline));
    ui = { open: false, screen: "main", menu: null, picker: null }; render();
  },
  cancel: () => { if (baseline) state = structuredClone(baseline); ACTIONS.close(); },
  screen: (el) => { ui.screen = el.dataset.screen; ui.menu = null; ui.picker = null; render(); },
  presets: () => { ui.picker = null; ui.menu = null; ui.presets = true; render(); },
  "presets-close": () => { ui.presets = false; render(); },
  preset: (el) => { ui.presets = false; applyStyle(el.dataset.style); },
  menu: (el) => { ui.menu = el.dataset.menu || null; render(); },
  fill: (el) => { ui.menu = null; setState((s) => { s.background.fill = el.dataset.fill; }); },
  // Заголовок и маркер убираются и возвращаются вместе
  "title-on": () => setState((s) => {
    for (const k of ["title", "marker"]) { s[k].on = true; s[k].color ||= DEFAULT_STATE[k].color; }
  }),
  "marker-on": () => setState((s) => { s.marker.on = true; s.marker.color ||= DEFAULT_STATE.marker.color; }),
  toggle: (el) => { closeAppearancePopups(); setState((s) => { s[el.dataset.key].on = !s[el.dataset.key].on; }); },   // тень, скругления, границы

  // Переключатель «по сторонам / по углам»; при сворачивании значения выравниваются по первому
  split: (el) => setState((s) => {
    const g = s[el.dataset.group];
    g.split = !g.split;
    if (g.split) return;
    if (el.dataset.group === "radius") g.tr = g.br = g.bl = g.tl;
    else if (el.dataset.group === "border") g.right = g.bottom = g.left = g.top;
    else { g.right = g.left; g.bottom = g.top; }
  }),

  // Тень: палитра готовых теней и окно параметров
  "shadow-palette": (el) => {
    const before = ui.shadowEditor?.before ?? structuredClone(state.shadow);
    ui.shadowEditor = null;
    ui.shadowPalette = { ...popupPos(el, -16, -68), before };   // как у пикеров цвета
    render();
  },
  "shadow-editor": () => {
    const { x, y, before } = ui.shadowPalette;
    ui.shadowPalette = null;
    ui.shadowEditor = { x: x + 30, y: y + 6, before };
    render();
  },
  "shadow-native": () => {
    nativeColor.value = state.shadow.color;
    nativeColor.showPicker ? nativeColor.showPicker() : nativeColor.click();
  },
  // Готовая тень, как и цвет в палитре пикера, применяется и закрывает окно
  "shadow-preset": (el) => { ui.shadowPalette = null; setState((s) => { s.shadow.color = el.dataset.color; s.shadow.opacity = +el.dataset.opacity; }); },
  "shadow-reset": () => setState((s) => { s.shadow = { ...structuredClone(DEFAULT_STATE.shadow), on: true }; }),
  "shadow-popup-apply": () => { ui.shadowPalette = ui.shadowEditor = null; render(); },
  "shadow-popup-cancel": () => {
    const before = (ui.shadowPalette || ui.shadowEditor).before;
    ui.shadowPalette = ui.shadowEditor = null;
    setState((s) => { s.shadow = before; });
  },

  // Шрифт заголовка: меню открывается вниз от строки — первый пункт (45 px) на уровне ссылки
  "font-menu": (el) => {
    const above = 8 + 45 / 2;   // отступ меню + половина первого пункта
    ui.fontMenu = ui.fontMenu || ui.fontEditor ? null : popupPos(el, -30, Math.round(el.getBoundingClientRect().height / 2 - above));
    ui.fontEditor = null;
    render();
  },
  "font-menu-close": () => { ui.fontMenu = null; render(); },
  // Окно настройки стиля: стрелка в строке меню заменяет меню окном, «‹» возвращает меню
  "font-style": (el) => {
    const { x, y } = ui.fontMenu;
    ui.fontMenu = null;
    ui.fontEditor = { x, y, key: el.dataset.font, draft: fontStyle(el.dataset.font) };
    render();
  },
  "font-editor-back": () => { const { x, y } = ui.fontEditor; ui.fontEditor = null; ui.fontMenu = { x, y }; render(); },
  "font-editor-close": () => { ui.fontEditor = null; render(); },
  "font-editor-reset": () => { ui.fontEditor.draft = { size: FONTS[ui.fontEditor.key].size, ...FONT_DEFAULT }; render(); },
  "font-editor-toggle": (el) => { const d = ui.fontEditor.draft; d[el.dataset.prop] = !d[el.dataset.prop]; render(); },
  "font-editor-apply": () => {
    const { key, draft } = ui.fontEditor;
    ui.fontEditor = null;
    setState((s) => { s.font = key; s.fontStyles[key] = draft; });
  },
  font: (el) => { ui.fontMenu = null; setState((s) => { s.font = el.dataset.font; }); },

  // Иконка заголовка
  "icon-picker": (el) => {
    if (ui.iconPicker) { ui.iconPicker = null; return render(); }
    ui.picker = null;
    const fromChip = el.classList.contains("chip");
    ui.iconPicker = { ...popupPos(el, fromChip ? -13 : -70, fromChip ? -14 : 30), query: "", section: "recent" };
    render();
  },
  "icon-picker-close": () => { ui.iconPicker = null; render(); },
  "icon-pick": (el) => {
    const glyph = el.dataset.glyph;
    recentIcons = [glyph, ...recentIcons.filter((x) => x !== glyph)].slice(0, 8);   // «недавние»
    ui.iconPicker = null;   // выбор иконки закрывает окно
    setState((s) => { s.icon.on = true; s.icon.glyph = glyph; });
  },
  "icon-clear": () => { ui.iconPicker = null; setState((s) => { s.icon.on = false; }); },
  "icon-section": (el) => {
    ui.iconPicker.section = el.dataset.section;
    settingsSlot.querySelectorAll(".ip-rail__btn").forEach((b) => b.classList.toggle("is-active", b === el));
    const target = settingsSlot.querySelector(`.ip-group[data-section="${el.dataset.section}"]`);
    const sc = settingsSlot.querySelector("#ip-scroll");
    if (target && sc) sc.scrollTop = target.offsetTop - sc.offsetTop;
  },

  // Границы: тип линии
  "line-menu": (el) => { ui.lineMenu = ui.lineMenu ? null : popupPos(el, -12, 28); render(); },
  "line-style": (el) => { ui.lineMenu = null; setState((s) => { s.border.style = el.dataset.style; }); },
  clear: (el) => {
    ui.picker = null;
    setState((s) => {
      s[el.dataset.key].on = false;
      if (el.dataset.key === "title" && ui.screen === "style") s.marker.on = false;   // на экране «Стиль» без заголовка убираем и маркер; на главном — нет
      if (el.dataset.key === "background") s.shadow.on = false;                       // без фона убираем и тень
    });
  },
  swatch: (el) => {
    // Клик по кружку — и цветному, и пустому — открывает пикер; выбор цвета включает элемент
    const key = el.dataset.key;
    if (ui.picker?.key === key) {
      ui.picker = null; render();
    } else {
      openPicker(el);
    }
  },

  // Размер
  // Меню величин: режим оси и краевые значения
  "size-menu": (el) => { ui.sizeMenu = ui.sizeMenu?.key === el.dataset.key ? null : { key: el.dataset.key, ...popupPos(el, -30, -16) }; render(); },
  "size-mode": (el) => {
    const k = el.dataset.key, mode = el.dataset.mode;
    const actual = k === "w" ? widgetFrame.offsetWidth : widgetFrame.offsetHeight;
    ui.sizeMenu = null;
    setState((s) => {
      // в фиксированный режим — с текущим фактическим размером
      if (mode === "px" && s.size[k].mode !== "px") s.size[k].px = actual;
      s.size[k].mode = mode;
    });
  },
  "edge-add": (el) => {
    const k = el.dataset.key;
    const actual = k.endsWith("W") ? widgetFrame.offsetWidth : widgetFrame.offsetHeight;
    ui.sizeMenu = null;
    setState((s) => { s.size[k] = actual; });
  },
  "edge-remove": (el) => setState((s) => { s.size[el.dataset.key] = null; }),
  "height-menu": () => { ui.picker = null; ui.menu = null; ui.presets = false; ui.heightMenu = true; render(); },
  "height-menu-close": () => { ui.heightMenu = false; render(); },
  "size-menu-close": () => { ui.sizeMenu = null; render(); },
  // Меню высоты главного экрана → модель размеров
  "height-mode": (el) => {
    ui.heightMenu = false;
    setState((s) => {
      const h = s.size.h;
      switch (el.dataset.mode) {
        case "fixed":   h.mode = "px"; break;
        case "content": h.mode = "auto"; s.size.minH = s.size.maxH = null; break;
        case "limited": h.mode = "auto"; s.size.minH ??= 200; s.size.maxH ??= 500; break;
        case "fill":    h.mode = "fill"; break;
      }
    });
  },
  "hide-empty": () => setState((s) => { s.hideEmpty = !s.hideEmpty; }),

  // Пикер
  // Клик по цвету палитры (и «нет цвета») сразу применяет его и закрывает окно — как ✓
  pick: (el) => { pickColor(el.dataset.color); ACTIONS["picker-apply"](); },
  "picker-apply": () => {
    const { key, draft } = ui.picker;
    ui.picker = null;
    setState((s) => {
      s[key] = draft;
      if (key === "title" && ui.screen === "style" && !(draft.on && draft.color)) s.marker.on = false;   // «нет цвета» у заголовка на экране «Стиль» убирает и маркер
      if (key === "background" && !(draft.on && draft.color)) s.shadow.on = false;   // тени без фона не бывает: «нет цвета» у фона убирает и тень
    });
  },
  "picker-cancel": () => { ui.picker = null; render(); },
  "picker-reset": () => {
    const def = DEFAULT_STATE[ui.picker.key];
    editDraft((d) => { d.color = def.color; d.opacity = def.opacity; d.on = true; });
  },
  "picker-native": () => {
    nativeColor.value = ui.picker.draft.color || "#000000";
    nativeColor.showPicker ? nativeColor.showPicker() : nativeColor.click();
  },
};

// Поля HEX и прозрачности: применяем по Enter или при уходе с поля
function commitPickerField(input) {
  // Окно настройки стиля: размер шрифта 8–64
  if (input.id === "fe-size") {
    const n = Math.round(Number(input.value));
    if (Number.isFinite(n) && n > 0) ui.fontEditor.draft.size = Math.min(64, Math.max(8, n));
    return render();
  }
  // Окно цвета тени: те же поля HEX и непрозрачности
  if (input.id === "shadow-hex" || input.id === "shadow-alpha") {
    if (input.id === "shadow-hex") {
      let v = input.value.trim().replace(/^#?/, "#").toLowerCase();
      if (/^#[0-9a-f]{3}$/.test(v)) v = "#" + [...v.slice(1)].map((c) => c + c).join("");
      return /^#[0-9a-f]{6}$/.test(v) ? setState((s) => { s.shadow.color = v; }) : render();
    }
    const n = Math.round(Number(input.value));
    return Number.isFinite(n) ? setState((s) => { s.shadow.opacity = Math.min(100, Math.max(0, n)); }) : render();
  }
  const key = ui.picker?.key;
  if (!key) return;
  if (input.id === "picker-hex") {
    let v = input.value.trim().replace(/^#?/, "#").toLowerCase();
    if (/^#[0-9a-f]{3}$/.test(v)) v = "#" + [...v.slice(1)].map((c) => c + c).join("");
    if (/^#[0-9a-f]{6}$/.test(v)) pickColor(v);
    else render();   // неверный код — вернуть прежнее значение
  }
  if (input.id === "picker-alpha") {
    const n = Math.round(Number(input.value));
    if (Number.isFinite(n)) editDraft((d) => { d.opacity = Math.min(100, Math.max(0, n)); });
    else render();
  }
}
// HEX-поле пикера: «#» нельзя стереть — курсор не заходит левее него, в значении только 0-9 a-f, не больше 6 знаков
(() => {
  const isHex = (t) => t && t.id === "picker-hex";
  const fix = (el) => {
    const v = "#" + el.value.replace(/[^0-9a-fA-F]/g, "").slice(0, 6);
    if (el.value !== v) el.value = v;
  };
  const clamp = (el) => {
    if (el.selectionStart < 1) el.setSelectionRange(1, Math.max(1, el.selectionEnd));
  };
  document.addEventListener("focusin", (e) => {
    if (!isHex(e.target)) return;
    fix(e.target);
    setTimeout(() => clamp(e.target), 0);
  });
  document.addEventListener("input", (e) => { if (isHex(e.target)) { fix(e.target); clamp(e.target); } }, true);
  document.addEventListener("select", (e) => { if (isHex(e.target)) clamp(e.target); });
  document.addEventListener("mouseup", (e) => { if (isHex(e.target)) setTimeout(() => clamp(e.target), 0); });
  document.addEventListener("keydown", (e) => {
    const el = e.target;
    if (!isHex(el)) return;
    const atStart = el.selectionStart <= 1 && el.selectionEnd <= 1;
    if ((e.key === "Backspace" && atStart) || ((e.key === "ArrowLeft" || e.key === "Home") && el.selectionStart <= 1 && !e.shiftKey)) {
      e.preventDefault();
      el.setSelectionRange(1, 1);
    }
    if (e.key === "a" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); el.setSelectionRange(1, el.value.length); }
  }, true);
})();

// Числовые поля: data-field="группа.ключ"
//   size.w | height.value | height.max
//   padding/margin: h (слева+справа), v (сверху+снизу), top/right/bottom/left
//   radius: all (все углы), tl/tr/br/bl;  border: all (все стороны), top/…;  shadow: x/y/blur/spread
const FIELD_LIMITS = {
  size: [40, 2000], height: [40, 2000], padding: [0, 100], margin: [0, 100],
  radius: [0, 100], border: [0, 20], shadow: [-50, 100], icon: [8, 64],
};
const FIELD_ALIASES = {
  h: ["left", "right"], v: ["top", "bottom"],
  all: null,   // зависит от группы, см. ниже
};
function setGroupValue(s, group, key, v) {
  if (group === "shadow") {
    const [min, max] = SHADOW_RANGES[key];
    s.shadow[key] = Math.min(max, Math.max(min, v));
    return;
  }
  const keys = key === "all"
    ? (group === "radius" ? ["tl", "tr", "br", "bl"] : ["top", "right", "bottom", "left"])
    : FIELD_ALIASES[key] || [key];
  for (const k of keys) s[group][k] = v;
}
function commitSizeField(input) {
  const [group, key] = input.dataset.field.split(".");
  const raw = input.value.trim();
  const n = Math.round(Number(raw));
  if (!Number.isFinite(n) || raw === "") return render();   // неверное или пустое значение — вернуть прежнее
  if (group === "size") return commitSize(key, n);
  const [min, max] = FIELD_LIMITS[group];
  const v = Math.min(max, Math.max(min, n));
  setState((s) => setGroupValue(s, group, key, v));
}

// Размер: w/h — значение в текущей единице (в «по контенту» и «заполнить» ввод числа делает ось фиксированной);
// minW…maxH — краевые значения в px
function commitSize(key, n) {
  setState((s) => {
    const sz = s.size;
    if (key === "w" || key === "h") {
      const a = sz[key];
      if (a.mode === "pct") a.pct = Math.min(100, Math.max(1, n));
      else { a.mode = "px"; a.px = Math.min(2000, Math.max(40, n)); }
      return;
    }
    sz[key] = Math.min(2000, Math.max(40, n));
  });
}

settingsSlot.addEventListener("change", (e) => {
  if (e.target.dataset.field) commitSizeField(e.target);
  else commitPickerField(e.target);
});
settingsSlot.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.target.closest(".picker, .font-editor") || e.target.dataset.field)) e.target.blur();
});

// Ползунки окна «Тень»: виджет меняется во время перетаскивания, окно не перерисовываем
settingsSlot.addEventListener("input", (e) => {
  const r = e.target.dataset.range;
  if (!r) return;
  const key = r.split(".")[1];
  const [min, max] = SHADOW_RANGES[key];
  state.shadow[key] = Number(e.target.value);
  e.target.style.setProperty("--p", ((state.shadow[key] - min) / (max - min)) * 100 + "%");
  e.target.parentElement.querySelector(`[data-field="shadow.${key}"]`).value = state.shadow[key];
  renderWidget();
});

// Esc закрывает верхний попап
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (ui.picker) ACTIONS["picker-cancel"]();
  else if (ui.shadowPalette || ui.shadowEditor) ACTIONS["shadow-popup-cancel"]();
  else if (ui.lineMenu || ui.fontMenu || ui.fontEditor || ui.iconPicker || ui.sizeMenu) { ui.lineMenu = ui.fontMenu = ui.fontEditor = ui.iconPicker = ui.sizeMenu = null; render(); }
  else if (ui.presets) { ui.presets = false; render(); }
  else if (ui.heightMenu) { ui.heightMenu = false; render(); }
  else if (ui.menu) { ui.menu = null; render(); }
});

// Клик мимо открытого пикера закрывает его без применения (цвет применяется только по ✓)
document.addEventListener("click", (e) => {
  if (ui.picker && !e.target.closest(".picker, [data-action=swatch]")) { ui.picker = null; render(); }
}, true);

// Попапы редакторов оформления: клик мимо закрывает (тень — с сохранением выбранного)
function closeAppearancePopups() { ui.shadowPalette = ui.shadowEditor = ui.lineMenu = ui.fontMenu = ui.fontEditor = ui.iconPicker = ui.sizeMenu = null; }
document.addEventListener("click", (e) => {
  const open = ui.shadowPalette || ui.shadowEditor || ui.lineMenu || ui.fontMenu || ui.fontEditor || ui.iconPicker || ui.sizeMenu;
  if (!open || e.target.closest(".shadow-palette, .shadow-editor, .line-menu, .font-menu, .font-editor, .icon-picker, .size-menu, .picker, [data-action=shadow-palette], [data-action=line-menu], [data-action=font-menu], [data-action=icon-picker], [data-action=size-menu]")) return;
  closeAppearancePopups();
  render();
}, true);

// Клик мимо меню высоты закрывает его
document.addEventListener("click", (e) => {
  if (ui.heightMenu && !e.target.closest(".hmenu, [data-action=height-menu]")) { ui.heightMenu = false; render(); }
}, true);

// Клик мимо попапа стилей закрывает его
document.addEventListener("click", (e) => {
  if (ui.presets && !e.target.closest(".presets, [data-action=presets]")) { ui.presets = false; render(); }
}, true);

// Клик мимо открытого меню закрывает его
document.addEventListener("click", (e) => {
  if (ui.menu && !e.target.closest(".menu, [data-menu]")) { ui.menu = null; render(); }
}, true);

settingsSlot.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  if (el.dataset.action === "screen" && !SCREENS[el.dataset.screen]) return;
  ACTIONS[el.dataset.action]?.(el);
});

settingsSlot.addEventListener("input", (e) => {
  if (e.target.id === "win-name") setState((s) => { s.name = e.target.value; });
  // Поиск в окне иконок: обновляем только список, чтобы поле не теряло фокус
  if (e.target.id === "icon-search") {
    ui.iconPicker.query = e.target.value;
    const tmp = document.createElement("div");
    tmp.innerHTML = iconPickerHTML();
    settingsSlot.querySelector("#ip-scroll").replaceWith(tmp.querySelector("#ip-scroll"));
  }
});

// Окно закрыто — клик по виджету открывает его снова
// Тулбар: шестерёнка открывает основное окно настроек, «Размер» — окно «Размер» под тулбаром; повторный клик закрывает.
// Кнопки — переключатели (aria-pressed = «выбрана» в ките), остальные пока без действия.
// Клик не должен всплывать до рамки виджета: она открывает окно, и закрытие кнопкой тут же отменилось бы
document.getElementById("widget-toolbar").addEventListener("click", (e) => {
  e.stopPropagation();
  const btn = e.target.closest("button");
  if (btn === toolbarGear) {
    const closing = ui.open && !(ui.anchor === "toolbar" && ui.screen === "size");
    ui = { open: !closing, screen: "main", menu: null, picker: null };
    render();
  } else if (btn === toolbarMove) {
    const closing = ui.open && ui.anchor === "toolbar" && ui.screen === "size";
    ui = { open: !closing, screen: "size", anchor: closing ? null : "toolbar", menu: null, picker: null };
    render();
  }
});

document.querySelector(".widget-frame").addEventListener("click", (e) => {
  if (e.target.closest(".wg__plus")) return;   // плюсы — отдельное действие (добавить виджет), настройки не открываем
  if (!ui.open) { ui = { open: true, screen: "main", menu: null, picker: null }; render(); }
});

function render() {
  renderWidget();
  renderSettings();
  renderEnvCmds();
}
// «Назад» и «Сброс» в шапке конструктора активны, когда окно настроек закрыто и применённые изменения отличаются от исходных
// (название по умолчанию у сценария в сравнении не участвует)
function renderEnvCmds() {
  const g = groupOf(w.dataset.kind || "typical");
  const norm = (st) => JSON.stringify({ ...st, name: Object.values(SCENARIO_TITLES).includes(st.name) ? "" : st.name });
  const changed = norm(state) !== norm(freshState(g));
  document.getElementById("env-undo").classList.toggle("env-cmd--on", !ui.open && !!envHistory[g]?.length);
  document.getElementById("env-reset").classList.toggle("env-cmd--on", !ui.open && changed);
}
// «Назад» — на один применённый шаг, «Сброс» — всё к значениям по умолчанию
const envHistory = {};
document.getElementById("env-undo").addEventListener("click", (e) => {
  if (!e.currentTarget.classList.contains("env-cmd--on")) return;
  const g = groupOf(w.dataset.kind);
  state = envHistory[g].pop();
  render();
});
document.getElementById("env-reset").addEventListener("click", (e) => {
  if (!e.currentTarget.classList.contains("env-cmd--on")) return;
  const g = groupOf(w.dataset.kind);
  state = freshState(g);
  envHistory[g] = [];
  render();
});

// Рамка демо: вспомогательная панель справа (без шапки); сцена масштабируется вместе с ней под окно
const SCENARIO_TITLES = { demo: "Заголовок виджета", typical: "Компании", blocks: "Новости" };
// «Демо» и «Типовой» делят одно состояние, «Новости» — своё: настройки одной ветки не влияют на другую
const groupOf = (id) => (id === "blocks" ? "blocks" : "base");
const stateGroups = {};
function freshState(group) {
  const st = structuredClone(DEFAULT_STATE);
  if (group === "blocks") {
    st.name = SCENARIO_TITLES.blocks;
    st.style = "noBg";                 // плашки контента со своим фоном — фон виджета выключен
    st.background.on = false;
    st.padding = { top: 12, right: 12, bottom: 12, left: 0, split: true };
  }
  return st;
}
function setScenario(id) {
  if (!SCENARIO_TITLES[id]) return;
  const prev = w.dataset.kind;
  w.dataset.kind = id;
  if (prev && groupOf(prev) !== groupOf(id)) {
    stateGroups[groupOf(prev)] = state;
    state = stateGroups[groupOf(id)] || freshState(groupOf(id));
    baseline = null;
    if (ui.open) ui = { open: true, anchor: ui.anchor, screen: "main", menu: null, picker: null };
  } else if (prev && prev !== id && state.name === SCENARIO_TITLES[prev]) {
    state.name = SCENARIO_TITLES[id];   // название по умолчанию меняем, только если его не правили
  }
  render();
}
const frame = DemoFrame.mount({
  stage: document.getElementById("stage"),
  top: 4,   // отступ сверху, чтобы сцена не липла к краю окна (слева 4 px задаёт рамка)
  scenarios: [
           { id: "demo", title: "Демо-виджет" },
           { id: "typical", title: "Типовой виджет" },
           { id: "blocks", title: "Виджет с блочным контентом" },
         ],
  value: { scenario: "typical" },
  onChange: (v) => setScenario(v.scenario),
  links: [{ title: "Макет в Figma", href: "https://www.figma.com/design/44fX18O5Huk4hmoaANMNIC/?node-id=11931-124266" }],
  team: [{ label: "Design", name: "Мария Смирнова" }, { label: "Develop" }],
});

w.dataset.kind = "typical";
render();
</script>
