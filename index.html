<title>Настройка виджета</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<style>
/* Сцена: окно настроек слева от виджета, как в макете (Figma 11931:124266).
   Прототип повторяет светлый интерфейс продукта, поэтому тема одна — светлая. */
:root {
  color-scheme: light;

  /* Цвета — переменные из Figma */
  --page-bg: #e9f5ff;                       /* фон дашборда */
  --bg: #ffffff;                            /* Background/background-color */
  --bg-contrast: #f3f5f7;                   /* Background/contrast_background-color — подложка окна */
  --bg-pale: rgba(51, 51, 51, 0.05);        /* Background/Contrast/pale_color — плашки контента, кнопки-стрелки */
  --bg-hover: #f3f4f8;                      /* Background/hover_background-color */
  --success: #12a12c;                       /* Background/Contrast/success_color — кнопка ✓ */

  --text: #000000;                          /* Text/text-color */
  --text-label: #8991a9;                    /* Text/label_text-color */
  --text-label-contrast: #656c87;           /* Text/label_contrast_text-color */
  --text-link: #2562aa;                     /* Text/link_text-color */
  --text-secondary: #313e78;                /* Text/secondary_text-color */

  --icon: #333333;                          /* Icon/icon-color */
  --icon-secondary: #656c87;                /* Icon/secondary_icon-color */
  --icon-unaccented: #cccccc;               /* Icon/unaccented_icon-color */
  --icon-label: #8991a9;                    /* Icon/label_icon-color */
  --icon-info: #5a49ab;                     /* Icon/info_icon-color */
  --icon-danger: #c2140a;                   /* Icon/danger_icon-color */
  --icon-primary: #f47843;                  /* Icon/primary_icon-color — стрелка «назад» в экранах */

  --border: #eaeaea;                        /* Border/border-color */
  --border-unaccented: #d2d6da;             /* Border/unaccented_border-color — обводка свотчей, подчёркивание полей */
  --border-info: #7b62f8;                   /* Border/info_border-color — рамка выделения виджета */

  --toolbar-bg: #eeebff;                    /* Background/Same/info_same_background-color */
  --toolbar-bg-active: #d4ccff;             /* Background/Same/info_active_same_background-color */
  --toolbar-border: rgba(123, 98, 248, 0.25);

  --brand: #0085f2;                         /* Extra/brand_color — маркер по умолчанию */

  /* Тени */
  --shadow-widget: 0 0 8px rgba(0, 0, 0, 0.06);                                   /* shadow_c */
  --shadow-window: 0 0 46px rgba(0, 0, 0, 0.12), 0 0 15px rgba(0, 0, 0, 0.12);     /* shadow_a */
  --shadow-toolbar: 0 0 9px rgba(0, 0, 0, 0.12);                                  /* shadow_a, blur 18 / 2 */
  --shadow-button: 0 0 3px rgba(0, 0, 0, 0.1);                                    /* shadow_d */
  --shadow-popup: 0 4px 18px rgba(0, 0, 0, 0.12);                                 /* shadow_a_0.4 */

  /* Отступы */
  --sp-3xs: 2px;
  --sp-2xs: 4px;
  --sp-xs: 6px;
  --sp-s: 8px;
  --sp-st: 10px;
  --sp-m: 12px;

  /* Скругления */
  --r-3xs: 2px;
  --r-2xs: 4px;
  --r-xs: 6px;
  --r-s: 8px;
  --r-m: 12px;
  --r-l: 16px;
  --r-pill: 100px;

  /* Типографика: Inter, letter-spacing −1.41% */
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tracking: -0.0141em;
  --fs-s: 13px;
  --fs-m: 14px;     /* подписи, ссылки */
  --fs-l: 15px;     /* заголовок экрана «Стиль» */
  --fs-xl: 16px;    /* название в шапке окна */
  --fs-2xl: 17px;   /* заголовок пикера */
  --fs-3xl: 18px;   /* заголовок виджета */
  --fw-regular: 400;
  --fw-bold: 600;

  /* Размеры */
  --widget-w: 557px;
  --widget-h: 280px;
  --window-w: 350px;
  --window-gap: 8px;      /* окно настроек: left −358px = 350 + 8 */
  --swatch: 24px;
  --swatch-l: 28px;       /* кружки палитры в пикерах */
}

/* Иконочные шрифты продукта, как в макете: cbuc-icons24 — иконки 24 px, cbuc-icons — иконки 16 px.
   Коды глифов у них общие. */
@font-face {
  font-family: "cbuc-icons24";
  src: url("assets/cbuc-icons24.ttf") format("truetype");
  font-display: block;
}
@font-face {
  font-family: "cbuc-icons";
  src: url("assets/cbuc-icons.ttf") format("truetype");
  font-display: block;
}

* { box-sizing: border-box; }

/* Иконка-глиф: <i class="ico" data-i="gear"></i> — 24 px, <i class="ico ico--s" …> — 16 px.
   Код глифа — в ICONS (скрипт внизу) */
.ico {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  width: 24px;
  height: 24px;
  padding-bottom: 1px;
  font-family: "cbuc-icons24";
  font-size: 24px;
  font-style: normal;
  font-weight: 400;
  line-height: 1;
  letter-spacing: 0;
  speak: never;
}
.ico--s { width: 16px; height: 16px; font-family: "cbuc-icons"; font-size: 16px; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--page-bg);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs-m);
  letter-spacing: var(--tracking);
  -webkit-font-smoothing: antialiased;
}

button {
  font: inherit;
  letter-spacing: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}
button:focus-visible { outline: 2px solid var(--border-info); outline-offset: 2px; }

.icon { display: block; flex: none; }

/* ---------- Сцена ---------- */

.stage {
  min-height: 100%;
  overflow-x: auto;
  padding: 88px 16px 48px;
  display: flex;
  justify-content: center;
}

/* Ширина сцены = окно + зазор + виджет; окно позиционируется от виджета, как в макете */
.scene {
  position: relative;
  flex: none;
  width: calc(var(--window-w) + var(--window-gap) + var(--widget-w));
  padding-left: calc(var(--window-w) + var(--window-gap));
}

/* ---------- Виджет в режиме редактирования ---------- */

.widget-frame {
  position: relative;
  width: var(--widget-w);
  height: var(--widget-h);
}
/* Рамка выделения поверх виджета (как в макете: виджет 557×280 целиком, рамка — сверху) */
.widget-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  border: 1px solid var(--border-info);
  border-radius: var(--r-3xs);
  pointer-events: none;
}

/* Слот под сам виджет — наполняется на этапе 2 */
.widget-slot {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
}

.handle {
  z-index: 2;
  position: absolute;
  width: 8px;
  height: 8px;
  background: var(--bg);
  border: 1px solid var(--border-info);
  border-radius: 7px;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
.handle--top    { left: 50%; top: 0; }
.handle--bottom { left: 50%; top: 100%; }
.handle--left   { left: 0;   top: 50%; }
.handle--right  { left: 100%; top: 50%; }

/* Тулбар — только для вида, клики не обрабатываются */
.toolbar {
  position: absolute;
  left: 0;
  top: -42px;
  display: flex;
  background: var(--toolbar-bg);
  border-radius: var(--r-xs);
  filter: drop-shadow(var(--shadow-toolbar));
  overflow: hidden;
  pointer-events: none;
}
.toolbar__item {
  display: flex;
  width: 36px;
  padding: 4px 6px;
  color: var(--icon);
}
/* Обводка поверх кнопок: тулбар 180×32, как в макете */
.toolbar::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: inset 0 0 0 1px var(--toolbar-border);
}
.toolbar__item--active {
  background: var(--toolbar-bg-active);
  color: var(--icon-info);
}
.toolbar__item--danger { color: var(--icon-danger); }

/* ---------- Виджет ----------
   --w-fill: заливка фона (цвет или градиент), --w-title: цвет заголовка, --w-marker: цвет маркера.
   data-fill="widget"  — фон на всей карточке (стили «внутри», «без заголовка»);
   data-fill="content" — заголовок на фоне страницы, фон только под контентом (стиль «снаружи»);
   data-bg="off"       — без фона и тени (стиль «без фона»). */

.w {
  --w-fill: var(--bg);
  --w-title: var(--text);
  --w-marker: var(--brand);
  --pad-h: 12px;            /* внутренние отступы — экран «Размер» */
  --pad-v: 12px;
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 0 var(--pad-h) var(--pad-v);
  background: var(--w-fill);
  border-radius: var(--r-s);
  box-shadow: var(--shadow-widget);
  overflow: hidden;
}

.w__header {
  display: flex;
  align-items: center;
  height: 24px;
  margin-top: var(--pad-v);
  padding-right: var(--pad-h);
  flex: none;
}
.w__title {
  margin: 0;
  font-size: var(--fs-3xl);
  font-weight: var(--fw-bold);
  line-height: 1.4;
  color: var(--w-title);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Маркер — у левого края карточки, на уровне первой строки */
.w__marker {
  position: absolute;
  left: 0;
  top: calc(var(--pad-v) + 1px);
  width: 4px;
  height: 22px;
  color: var(--w-marker);
}

.w__content {
  flex: 1;
  min-height: 0;
  padding-top: 2px;
}

/* Заглушка контента: три плашки 246 / 145 / 204 × 24 */
.w__lines {
  display: flex;
  flex-direction: column;
  gap: var(--sp-s);
  width: 246px;
  max-width: 100%;
}
.w__line {
  height: 24px;
  border-radius: var(--r-xs);
  background: var(--bg-pale);
}
.w__line:nth-child(2) { width: 145px; }
.w__line:nth-child(3) { width: 204px; }

/* Заголовок выключен: контент поднимается к верхнему отступу */
.w[data-title="off"] .w__header { display: none; }
.w[data-title="off"] .w__content { padding-top: calc(var(--pad-v) + 2px); }   /* contentDashWidget сдвинут на 2 px */

.w[data-marker="off"] .w__marker { display: none; }

/* Стиль «снаружи»: карточка прозрачная, фон и тень переходят на контент */
.w[data-fill="content"] {
  gap: 4px;
  padding: 0;
  background: transparent;
  box-shadow: none;
  overflow: visible;
}
.w[data-fill="content"] .w__header { padding-left: var(--pad-h); }
.w[data-fill="content"] .w__content {
  padding: calc(var(--pad-v) + 2px) var(--pad-h) var(--pad-v);
  background: var(--w-fill);
  border-radius: var(--r-s);
  box-shadow: var(--shadow-widget);
}

/* Без фона: ни заливки, ни тени */
.w[data-bg="off"],
.w[data-shadow="off"],
.w[data-shadow="off"] .w__content { box-shadow: none; }
.w[data-radius="off"],
.w[data-radius="off"] .w__content { border-radius: 0; }

.w[data-bg="off"] .w__content {
  background: transparent;
  box-shadow: none;
}


/* ---------- Окно настроек ---------- */

/* Слот под окно — наполняется на этапах 3–5 */
.settings-slot {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--window-w);
}

/* Окно: серая подложка, внутри белые «облачка» */
.win {
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 0 var(--sp-2xs) var(--sp-2xs);
  background: var(--bg-contrast);
  border-radius: var(--r-m);
  box-shadow: var(--shadow-window);
  overflow: hidden;
}

.win__head {
  display: flex;
  align-items: center;
  gap: var(--sp-3xs);
  height: 44px;
  padding: 6px 0 6px var(--sp-s);
}

/* Название — поле ввода, оформленное как текст с подчёркиванием */
.win__name {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 2px;
  height: 28px;
  min-width: 0;
  padding-left: var(--sp-2xs);
}
.win__name input {
  field-sizing: content;
  min-width: 40px;
  max-width: 220px;
  margin: 0;
  padding: 0 0 1px;
  border: 0;
  border-bottom: 1px solid var(--border-unaccented);
  background: none;
  font: var(--fw-bold) var(--fs-xl) / normal var(--font);
  letter-spacing: var(--tracking);
  color: var(--text);
  outline: none;
}
.win__name input:focus { border-bottom-color: var(--text-link); }

.win__cmds {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--sp-m);
  padding: 0 var(--sp-2xs) 0 var(--sp-st);
}

.btn-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: var(--r-pill);
  color: var(--icon-secondary);
}
.btn-icon:hover { background: var(--bg-hover); }

.btn-apply {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: var(--r-pill);
  background: var(--success);
  color: var(--bg);
  filter: drop-shadow(var(--shadow-button));
}

.win__body {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2xs);
}

.cloud {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--sp-s);
  padding: var(--sp-s) var(--sp-m);
  background: var(--bg);
  border-radius: var(--r-s);
}

.cloud--stub {
  height: 100px;
  align-items: center;
  justify-content: center;
  color: var(--text-label);
}

.row {
  display: flex;
  align-items: center;
  gap: var(--sp-s);
  min-height: 24px;
}
.row__grow { flex: 1; min-width: 0; display: flex; align-items: center; }

.label { color: var(--text-label); white-space: nowrap; }

.link {
  color: var(--text-link);
  white-space: nowrap;
  text-align: left;
}
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.link[disabled], .btn-arrow[disabled] { cursor: default; text-decoration: none; }

/* Круглая кнопка со стрелкой › */
.btn-arrow {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
  width: 24px;
  height: 24px;
  border-radius: var(--r-pill);
  background: var(--bg-pale);
  color: var(--icon-label);
}
.btn-arrow svg { transform: rotate(180deg); }
.btn-arrow:not([disabled]):hover { background: rgba(51, 51, 51, 0.15); }
.cloud > .btn-arrow { position: absolute; right: var(--sp-m); top: var(--sp-s); }

/* Ряд свотчей «Фон / Заголовок / Маркер» */
.swatches {
  display: flex;
  align-items: center;
  gap: var(--sp-m);
}
.swatch-field { display: flex; align-items: center; gap: var(--sp-s); height: 24px; }
.swatch-wrap { display: flex; align-items: center; gap: 2px; }

.swatch {
  width: var(--swatch);
  height: var(--swatch);
  flex: none;
  border: 1px solid var(--border-unaccented);
  border-radius: var(--r-pill);
  background: var(--swatch-color, var(--bg));
}
/* Ховер — как в компоненте colorBtn (Figma 10466:51085): кружок растёт с 24 до 28 px от центра,
   обводка остаётся 1 px. Отрицательный отступ сохраняет раскладку соседей. */
.swatch:hover { width: 28px; height: 28px; margin: -2px; }
/* Выключено: белый круг, перечёркнутый по диагонали */
.swatch[data-off] {
  background:
    linear-gradient(to top right, transparent calc(50% - .5px), var(--border-unaccented) calc(50% - .5px),
                    var(--border-unaccented) calc(50% + .5px), transparent calc(50% + .5px)),
    var(--bg);
}

.swatch-clear {
  display: flex;
  width: 16px;
  height: 17px;
  color: var(--icon-unaccented);
}
button.swatch-clear:hover { color: var(--icon-secondary); }

/* ---------- Экран «Стиль» ---------- */

/* Шапка подэкрана: кнопка «назад» + название */
.win__title { display: flex; align-items: center; }
.win__title h3 {
  margin: 0;
  padding: 0 0 1px 6px;
  font-size: var(--fs-xl);
  font-weight: var(--fw-bold);
  line-height: 28px;
}
.btn-back {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: var(--r-pill);
  background: var(--bg);
  color: var(--icon-primary);
  filter: drop-shadow(var(--shadow-button));
}
.btn-icon[data-idle] { color: var(--icon-unaccented); }

/* Сетка «подпись — редактор» */
.form {
  display: grid;
  grid-template-columns: max-content 1fr;   /* колонка подписей по самой широкой подписи блока, редакторы всегда через 8 px */
  gap: var(--sp-s);
  align-items: center;
}
.form > * { min-height: 24px; display: flex; align-items: center; min-width: 0; }
.label--strong {
  color: var(--text);
  font-size: var(--fs-l);
  font-weight: var(--fw-bold);
}
.editor { display: flex; align-items: center; gap: 2px; }
.editor--wide { gap: var(--sp-s); }
.text-link-static { color: var(--text-link); white-space: nowrap; }

/* Тень — статичный свотч: шахматка + половинка цвета */
.swatch-shadow {
  position: relative;
  width: 24px;
  height: 24px;
  flex: none;
  padding: 1px;
  border: 1px solid var(--border-unaccented);
  border-radius: 24px;
  background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), var(--bg);
  overflow: hidden;
}
.swatch-shadow::before {   /* шахматка, в макете — с прозрачностью 15% */
  content: "";
  position: absolute;
  inset: 0;
  background: url("assets/checker.png") top left / 8px 8px;
  opacity: 0.15;
}
.swatch-shadow::after {    /* половинка цвета тени */
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  width: 11px;
  height: 22px;
  border-radius: 12px 0 0 12px;
  background: #000;
}

/* Скругления — статичное поле «8» и переключатель «по углам» */
.radius { flex: 1; display: flex; align-items: center; position: relative; }
.radius__field {
  display: flex;
  align-items: center;
  gap: var(--sp-xs);
  width: 56px;
  height: 24px;
  border-bottom: 1px solid var(--border-unaccented);
  color: var(--text);
}
.radius__switch { position: absolute; right: 0; color: var(--icon-secondary); font-size: 20px; } /* icon-size_st = 20 */

/* Чипсы под облачками */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-s);
  padding: var(--sp-2xs) 0 var(--sp-2xs) var(--sp-m);
}
.chip {
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 var(--sp-m);
  border-radius: var(--r-pill);
  background: var(--bg);
  color: var(--text-label-contrast);
}
.chip[disabled] { cursor: default; }
.chip:not([disabled]):hover { color: var(--text); }

/* Выпадашка «Заливка фоном» */
.menu {
  position: absolute;
  left: 106px;
  top: 153px;
  z-index: 2;
  width: 217px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 6px;
  background: var(--bg);
  border-radius: var(--r-s);
  filter: drop-shadow(0 0 9px rgba(0, 0, 0, 0.12));
}
.menu__head { display: flex; justify-content: space-between; align-items: flex-start; }
.menu__title {
  height: 28px;
  display: flex;
  align-items: center;
  padding: 0 var(--sp-m) 0 22px;
  color: var(--text-label);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  white-space: nowrap;
}
.menu__close { display: flex; padding: 2px 4px 0 0; color: var(--icon-secondary); }
.menu__close svg { width: 24px; height: 24px; }
.menu__item {
  display: flex;
  align-items: center;
  gap: 2px;
  height: 32px;
  padding: 0 16px 0 8px;
  border-radius: 20px;
  font-size: var(--fs-l);
  text-align: left;
}
.menu__item:hover { background: var(--bg-hover); }
.menu__bullet { width: 12px; height: 12px; flex: none; color: var(--marker-color, #cc3d00); }

/* ---------- Экран «Размер» (Figma 11931:126178) ---------- */

.size-form { display: grid; grid-template-columns: max-content auto; gap: var(--sp-s); align-items: center; }
.size-field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 130px;
  height: 24px;
  border-bottom: 1px solid var(--border-unaccented);
}
.size-field:focus-within { border-bottom-color: var(--text-link); }
.size-field input,
.pad-field input {
  width: 100%;
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  letter-spacing: inherit;
  color: var(--text);
  outline: none;
}
.size-field input::placeholder { color: rgba(137, 145, 169, 0.6); }   /* placeholder-color_inputtext */
.size-fill { color: var(--text-label); white-space: nowrap; }
.size-fill:not([disabled]):hover { color: var(--text-link); }
.size-fill[disabled] { cursor: default; }

.cloud--pads { gap: var(--sp-2xs); }
.cloud__title { display: flex; align-items: center; height: 24px; font-size: var(--fs-l); font-weight: var(--fw-bold); }
.pads { display: flex; flex-direction: column; gap: var(--sp-s); }
.pad-row { position: relative; display: flex; align-items: center; gap: var(--sp-s); height: 24px; }
.pad-row--outer { gap: 28px; }      /* поля обоих рядов на одной вертикали, как в макете */
.pad-fields { display: flex; gap: var(--sp-s); }
.pad-field {
  display: flex;
  align-items: center;
  gap: var(--sp-xs);
  width: 56px;
  height: 24px;
  border-bottom: 1px solid var(--border-unaccented);
  color: var(--icon-label);
}
.pad-field:focus-within { border-bottom-color: var(--text-link); }
.pad-row .ico { position: absolute; right: 0; top: 0; font-size: 20px; color: var(--icon-secondary); }  /* icon-size_st = 20 */

.toggle-row { display: flex; align-items: center; gap: var(--sp-s); height: 24px; }
.switch { display: flex; align-items: center; height: 24px; }
.switch__track {
  position: relative;
  width: 24px;
  height: 16px;
  border-radius: 8px;
  background: var(--border-unaccented);      /* выключенного состояния в макете нет */
}
.switch__track::after {
  content: "";
  position: absolute;
  left: 2px;
  top: 2px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--bg);
}
.switch[aria-checked="true"] .switch__track { background: #f6733c; }
.switch[aria-checked="true"]:hover .switch__track { background: #e4662f; }
.switch[aria-checked="true"] .switch__track::after { left: 10px; }

/* ---------- Попап выбора стиля (Figma 11931:124340) ----------
   Две колонки карточек-превью 240×132; позиция относительно окна — (44, 183). */

.presets {
  position: absolute;
  left: 44px;
  top: 183px;
  z-index: 3;
  display: grid;
  grid-template-columns: repeat(2, 240px);
  grid-auto-flow: column;
  grid-template-rows: repeat(2, 132px);
  gap: 4px;
  padding: 4px;
  background: var(--bg-contrast);
  border-radius: var(--r-l);
  filter: drop-shadow(0 4px 9px rgba(0, 0, 0, 0.12));
}
.preset {
  display: block;
  align-self: start;
  padding: var(--sp-s);
  border-radius: var(--r-s);
  text-align: left;
}
/* Превью 224×116: каждый стиль показывает свою подложку */
.preset__shot {
  display: block;
  position: relative;
  width: 224px;
  height: 116px;
  border-radius: var(--r-xs);
  color: var(--text);
}
.preset__shot::before {        /* подложка */
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: var(--bg);
  box-shadow: var(--shadow-widget);
}
.preset__title {
  display: block;
  position: absolute;
  left: 10px;
  top: 8px;
  font-size: var(--fs-m);
  font-weight: var(--fw-bold);
  white-space: nowrap;
}
.preset__text {
  display: block;
  position: absolute;
  left: 10px;
  width: 198px;
  font-size: var(--fs-s);
  line-height: normal;
}
.preset__marker {
  display: block;
  position: absolute;
  left: 0;
  top: 10px;
  width: 3px;
  height: 14px;
  border-radius: 0 3px 3px 0;
  background: var(--brand);
}
.preset--inside .preset__text { top: 35px; }
.preset--outside .preset__shot::before { top: 33px; }          /* подложка только под контентом */
.preset--outside .preset__text { top: 41px; }
.preset--noTitle .preset__shot { border-radius: var(--r-s); }
.preset--noTitle .preset__text { top: 10px; width: 206px; }
.preset--noBg .preset__shot { border: 1px solid var(--bg-pale); border-radius: var(--r-s); }
.preset--noBg .preset__shot::before { display: none; }          /* без подложки */
.preset--noBg .preset__text { left: 9px; top: 9px; }

.presets__close {
  position: absolute;
  right: -14px;
  top: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: var(--r-pill);
  background: rgba(205, 205, 205, 0.8);   /* Background/Opacity/translucent_background-color */
  color: var(--bg);
}

/* ---------- Пикер цвета (Figma: «окно текста/фона со сбросом», 366 px) ---------- */

.picker {
  position: absolute;
  z-index: 3;
  width: 366px;
  display: flex;
  flex-direction: column;
  background: var(--bg-contrast);
  border-radius: var(--r-m);

.picker__head { display: flex; align-items: center; min-height: 56px; }
.picker__caption {
  align-self: stretch;
  display: flex;
  align-items: flex-end;
  padding: 0 0 19px 16px;
  font-size: var(--fs-2xl);
  line-height: normal;
  white-space: nowrap;
}
.picker__mid { flex: 1; display: flex; align-items: center; padding-left: 6px; }
.picker__cmds { display: flex; align-items: center; gap: var(--sp-m); padding-right: var(--sp-m); }
.picker__tools { display: flex; align-items: center; gap: var(--sp-xs); }
.picker__tool {

  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: var(--r-pill);
  color: var(--icon-secondary);

.picker__close { display: flex; padding-right: var(--sp-s); color: var(--icon-secondary); }
.picker__close svg { width: 24px; height: 24px; }

/* Тумблер «Цвет / Картинка» (только у фона) */
.tumbler {
  display: flex;
  gap: 2px;
  padding: 1px;
  border-radius: var(--r-pill);
  background: var(--bg-pale);
}
.tumbler__item {
  display: flex;
  align-items: center;
  height: 26px;
  padding: 0 var(--sp-m);
  border-radius: var(--r-pill);
  font-size: var(--fs-l);
  color: var(--text-label-contrast);
  cursor: default;
}
.tumbler__item[aria-pressed="true"] {
  background: var(--bg);
  color: var(--text);

.picker__body { display: flex; flex-direction: column; gap: var(--sp-2xs); padding: 0 var(--sp-2xs) var(--sp-2xs); }

/* «Нет цвета»: диагональ под 45°, как у кружка «нет фона» в палитре (а не из угла в угол вытянутой плашки) */

  background:

}
.picker__fields { display: flex; align-items: center; gap: var(--sp-s); }

/* Поля с подчёркиванием */

  display: flex;
  align-items: flex-end;
  height: 24px;
  padding-bottom: 3px;
  border-bottom: 1px solid var(--border-unaccented);
}
.ufield input {
  width: 100%;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  letter-spacing: inherit;

  outline: none;
}
.ufield:focus-within { border-bottom-color: var(--text-link); }
.ufield--format { width: 46px; }
.ufield--format .ico { position: absolute; right: 0; top: calc(50% - 8.5px); color: var(--icon-unaccented); }
.ufield--hex { width: 66px; }
.ufield--alpha { width: 24px; }
.ufield--alpha input { text-align: right; }
.picker__alpha { display: flex; align-items: flex-end; gap: var(--sp-2xs); }
.picker__alpha .pct { width: 11px; height: 24px; display: flex; align-items: flex-end; padding-bottom: 3px; }

/* Палитра 28 px, 10 в ряд */
.palette {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 6px;
  padding: var(--sp-m) 0 2px;
}
.palette__item {
  width: var(--swatch-l);
  height: var(--swatch-l);
  border: 1px solid var(--border-unaccented);
  border-radius: var(--r-pill);
  background: var(--c);
}
/* Ховер — по аналогии с colorBtn (+4 px от центра): у кружка 28 px своего состояния в файле нет */
.palette__item:hover { width: 32px; height: 32px; margin: -2px; }
.palette__item[data-none] { border: 0; background: none; }
.palette__item[data-none] svg { display: block; width: 100%; height: 100%; }

.picker__links {
  display: flex;
  flex-direction: column;
  gap: var(--sp-m);
  padding: 16px 0 var(--sp-m);
}
.picker__links::before { content: ""; height: 1px; margin: 0 12px; background: var(--border); }
.picker__links > div { display: flex; gap: 20px; height: 24px; padding-left: 2px; }
.plink { color: var(--text-secondary); white-space: nowrap; }
.plink:not([disabled]):hover { text-decoration: underline; text-underline-offset: 3px; }
.plink[disabled] { cursor: default; }

/* ---------- Узкие экраны ---------- */

  .stage { justify-content: flex-start; padding-top: 64px; }

// Проставляет глиф во все <i class="ico" data-i="…"> внутри root
function paintIcons(root = document) {

// Палитры пикеров — из Figma (узлы 11931:124382, 11931:124403, 11931:124361).
// null — «нет цвета» (первый кружок с диагональю).
const PALETTES = {
  title: [null, "#000000", "#999999", "#8991a9", "#2562aa", "#5a49ab", "#cc3d00", "#c2140a", "#e6a119", "#298e3c"],
  marker: [null, "#0085f2", "#2562aa", "#c2140a", "#f47843", "#e6a119", "#298e3c", "#5a49ab", "#cccccc", "#8991a9"],
  // Фон: белый и 8 пастельных градиентов (−69.6°, цвет → белый)
  background: [null, "#ffffff", "#ebf4ff", "#eeebff", "#ffeceb", "#fff8eb", "#ebffee", "#fff1eb", "#f8f8f8", "#ebfdff"],
};

// #rrggbb + непрозрачность 0–100 → rgba()
function rgba(hex, opacity = 100) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${opacity / 100})`;
}

// Цвет фона из палитры → CSS-заливка, как в макете: белый — сплошной, остальные — градиент в белый
function backgroundFill(hex, opacity = 100) {
  if (!hex) return "transparent";
  if (hex.toLowerCase() === "#ffffff") return rgba(hex, opacity);
  return `linear-gradient(-69.6deg, ${rgba(hex, opacity)} 0%, ${rgba("#ffffff", opacity)} 100%)`;
}

// Цвет части с учётом прозрачности; null — «нет цвета»
function partColor(key) {
  const { color, opacity } = state[key];
  if (!color) return null;
  return key === "background" ? backgroundFill(color, opacity) : rgba(color, opacity);
}
const isOn = (key) => state[key].on && !!state[key].color;

function renderWidget() {
  // Без заголовка «фон только на контенте» не отличим от фона на всём виджете
  const fill = isOn("title") ? state.background.fill : "widget";

  w.dataset.title = isOn("title") ? "on" : "off";
  w.dataset.marker = isOn("marker") ? "on" : "off";
  w.dataset.bg = isOn("background") ? "on" : "off";
  w.dataset.fill = fill;
  w.dataset.shadow = state.shadow ? "on" : "off";

  w.style.setProperty("--w-title", partColor("title") || "transparent");
  w.style.setProperty("--w-marker", partColor("marker") || "transparent");
  w.style.setProperty("--w-fill", partColor("background") || "transparent");

  wTitle.textContent = state.name;

  // Размер и отступы: рамка выделения повторяет размер виджета, внешние отступы — внутри неё
  const { size, padding, margin } = state;
  widgetFrame.style.width = (size.w ?? CELL.w) + "px";
  widgetFrame.style.height = (size.h ?? CELL.h) + "px";
  widgetSlot.style.inset = `${margin.v}px ${margin.h}px`;

// Применить пресет стиля: раскладка и включённость элементов; выбранные цвета сохраняются
function applyStyle(key) {
  const s = STYLES[key];
  state.style = key;
  state.title.on = s.title;
  state.marker.on = s.marker;
  state.background.on = s.background;
  state.background.fill = s.fill;
  render();
}

function setState(mutator) {
  mutator(state);
  render();
}

function resetState() {
  state = structuredClone(DEFAULT_STATE);
  render();
}

// Стиль выводится из состояния: так ручные переключения Фон/Заголовок дают те же

function currentStyle() {
  const { title, background } = state;
  if (!isOn("background")) return "noBg";
  if (background.fill === "content") return "outside";
  if (!isOn("title")) return "noTitle";
  return "inside";
}

            <button class="plink" data-action="picker-native">Другой цвет</button>
            ${isBg ? `<button class="plink" disabled>Градиент</button><button class="plink" disabled>Текстура</button>` : ""}
          </div></div>
        </div>
      </div>
    </div>`;
}

// Выбор цвета применяется к виджету сразу; null — «нет цвета»
function pickColor(key, color) {
  setState((s) => {
    s[key].color = color || null;
    if (color) s[key].on = true;
  });
}

function openPicker(el) {
  const key = el.dataset.key;
  const sw = el.getBoundingClientRect();
  const slot = settingsSlot.getBoundingClientRect();
  const [dx, dy] = PICKER_OFFSET[key];
  ui.menu = null;
  ui.picker = {
    key,
    x: Math.round(sw.left - slot.left + dx),
    y: Math.round(sw.top - slot.top + dy),
    before: structuredClone(state[key]),   // для отмены по ✕
  };
  render();
}

function renderSettings() {
  toolbarGear.classList.toggle("toolbar__item--active", ui.open);
  if (!ui.open) { settingsSlot.innerHTML = ""; return; }

  // Не пересобираем поле названия, пока в нём печатают — иначе теряется курсор
  const focused = document.activeElement?.id === "win-name";
  if (focused && settingsSlot.dataset.screen === ui.screen) {
    // Обновляем всё, кроме шапки
    const tmp = document.createElement("div");
    tmp.innerHTML = SCREENS[ui.screen]();
    settingsSlot.querySelector(".win__body").replaceWith(tmp.querySelector(".win__body"));
  } else {
    settingsSlot.innerHTML = `<section class="win" aria-label="Настройки виджета">${SCREENS[ui.screen]()}</section>`
      + (ui.picker ? pickerHTML() : "")
      + (ui.presets ? presetsHTML() : "");
    settingsSlot.dataset.screen = ui.screen;
  }
  paintIcons(settingsSlot);
}

// Действия окна
const ACTIONS = {
  reset: () => { ui.picker = null; resetState(); },
  close: () => { ui = { open: false, screen: "main", menu: null, picker: null }; render(); },
  screen: (el) => { ui.screen = el.dataset.screen; ui.menu = null; ui.picker = null; render(); },
  presets: () => { ui.picker = null; ui.menu = null; ui.presets = true; render(); },
  "presets-close": () => { ui.presets = false; render(); },
  preset: (el) => { ui.presets = false; applyStyle(el.dataset.style); },
  menu: (el) => { ui.menu = el.dataset.menu || null; render(); },
  fill: (el) => { ui.menu = null; setState((s) => { s.background.fill = el.dataset.fill; }); },
  "title-on": () => setState((s) => { s.title.on = true; s.title.color ||= DEFAULT_STATE.title.color; }),
  "marker-on": () => setState((s) => { s.marker.on = true; s.marker.color ||= DEFAULT_STATE.marker.color; }),
  toggle: (el) => setState((s) => { s[el.dataset.key] = !s[el.dataset.key]; }),   // тень, скругления
  clear: (el) => { ui.picker = null; setState((s) => { s[el.dataset.key].on = false; }); },
  swatch: (el) => {
    // Клик по кружку — и цветному, и пустому — открывает пикер; выбор цвета включает элемент
    const key = el.dataset.key;
    if (ui.picker?.key === key) {
      ui.picker = null; render();
    } else {
      openPicker(el);
    }
  },

  // Размер
  "size-fill": (el) => setState((s) => { s.size[el.dataset.key] = null; }),
  "hide-empty": () => setState((s) => { s.hideEmpty = !s.hideEmpty; }),

  // Пикер
  pick: (el) => pickColor(ui.picker.key, el.dataset.color),
  "picker-apply": () => { ui.picker = null; render(); },
  "picker-cancel": () => {
    const { key, before } = ui.picker;
    ui.picker = null;
    setState((s) => { s[key] = before; });
  },
  "picker-reset": () => {
    const key = ui.picker.key;
    setState((s) => {
      s[key].color = DEFAULT_STATE[key].color;
      s[key].opacity = DEFAULT_STATE[key].opacity;
      s[key].on = true;
    });
  },
  "picker-native": () => {
    nativeColor.value = state[ui.picker.key].color || "#000000";
    nativeColor.showPicker ? nativeColor.showPicker() : nativeColor.click();
  },
};

// Поля HEX и прозрачности: применяем по Enter или при уходе с поля
function commitPickerField(input) {
  const key = ui.picker?.key;
  if (!key) return;
  if (input.id === "picker-hex") {
    let v = input.value.trim().replace(/^#?/, "#").toLowerCase();
    if (/^#[0-9a-f]{3}$/.test(v)) v = "#" + [...v.slice(1)].map((c) => c + c).join("");
    if (/^#[0-9a-f]{6}$/.test(v)) pickColor(key, v);
    else render();   // неверный код — вернуть прежнее значение
  }
  if (input.id === "picker-alpha") {
    const n = Math.round(Number(input.value));
    if (Number.isFinite(n)) setState((s) => { s[key].opacity = Math.min(100, Math.max(0, n)); });
    else render();
  }
}
// Поля экрана «Размер»: data-field="size.w" | "padding.h" | … ; пустая ширина/высота — «заполнить»
const FIELD_LIMITS = { size: [40, 2000], padding: [0, 100], margin: [0, 100] };
function commitSizeField(input) {
  const [group, key] = input.dataset.field.split(".");
  const raw = input.value.trim();
  if (group === "size" && raw === "") return setState((s) => { s.size[key] = null; });
  const n = Math.round(Number(raw));
  if (!Number.isFinite(n) || raw === "") return render();   // неверное значение — вернуть прежнее
  const [min, max] = FIELD_LIMITS[group];
  setState((s) => { s[group][key] = Math.min(max, Math.max(min, n)); });
}

settingsSlot.addEventListener("change", (e) => {
  if (e.target.dataset.field) commitSizeField(e.target);
  else commitPickerField(e.target);
});
settingsSlot.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.target.closest(".picker") || e.target.dataset.field)) e.target.blur();
});

// Esc закрывает верхний попап
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (ui.picker) ACTIONS["picker-cancel"]();
  else if (ui.presets) { ui.presets = false; render(); }
  else if (ui.menu) { ui.menu = null; render(); }
});

// Клик мимо открытого пикера подтверждает выбор и закрывает его
document.addEventListener("click", (e) => {
  if (ui.picker && !e.target.closest(".picker, .swatch")) { ui.picker = null; render(); }
}, true);

// Клик мимо попапа стилей закрывает его
document.addEventListener("click", (e) => {
  if (ui.presets && !e.target.closest(".presets, [data-action=presets]")) { ui.presets = false; render(); }
}, true);

// Клик мимо открытого меню закрывает его
document.addEventListener("click", (e) => {
  if (ui.menu && !e.target.closest(".menu, [data-menu]")) { ui.menu = null; render(); }
}, true);

settingsSlot.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  if (el.dataset.action === "screen" && !SCREENS[el.dataset.screen]) return;
  ACTIONS[el.dataset.action]?.(el);
});

settingsSlot.addEventListener("input", (e) => {
  if (e.target.id === "win-name") setState((s) => { s.name = e.target.value; });
});

// Окно закрыто — клик по виджету открывает его снова
document.querySelector(".widget-frame").addEventListener("click", () => {
  if (!ui.open) { ui = { open: true, screen: "main", menu: null, picker: null }; render(); }
});

function render() {
  renderWidget();
  renderSettings();
}

render();
</script>
